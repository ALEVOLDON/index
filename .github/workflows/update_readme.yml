name: Update README Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      # PIPELINE EXECUTION
      - name: Run Fetch Repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch

      - name: Run Analysis Engine
        run: npm run analyze

      - name: Run Auto Discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run discover

      - name: Validate Repository Data
        run: npm run validate

      - name: Render New README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run render

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/ config/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: auto-update repo stats [skip ci]"
          git push
